<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Source for images/og-image.jpg (1200x630 social preview). Regenerate with:
     chrome --headless --hide-scrollbars --force-device-scale-factor=1 --window-size=1200,630 --screenshot=og-image.png images/og/og.html
     then convert the PNG to JPG (quality ~90) as images/og-image.jpg -->
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
	* { box-sizing: border-box; margin: 0; }
	html, body { width: 1200px; height: 630px; overflow: hidden; }
	body {
		font-family: "Inter", "Segoe UI", Arial, sans-serif; color: #e6e9f0; position: relative;
		background:
			radial-gradient(circle at 85% 20%, rgba(110, 168, 255, 0.22), transparent 45%),
			radial-gradient(circle at 10% 100%, rgba(34, 211, 238, 0.14), transparent 40%),
			#0a0e17;
	}
	.grid {
		position: absolute; inset: 0;
		background-image: linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px);
		background-size: 48px 48px;
		-webkit-mask-image: radial-gradient(ellipse 80% 80% at 40% 40%, #000 30%, transparent 85%);
	}
	.wrap { position: relative; display: flex; align-items: center; gap: 64px; height: 100%; padding: 0 80px; }
	.text { flex: 1; }
	.eyebrow {
		display: inline-flex; align-items: center; gap: 10px; font-family: "JetBrains Mono", monospace; font-size: 20px;
		color: #a3adbf; border: 1px solid #2a3446; background: rgba(17, 23, 36, .8); padding: 8px 16px; border-radius: 999px;
	}
	.eyebrow i { width: 10px; height: 10px; border-radius: 50%; background: #6ea8ff; box-shadow: 0 0 0 4px rgba(110,168,255,.2); }
	h1 { margin-top: 26px; font-size: 64px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.04; color: #fff; }
	.role {
		margin-top: 18px; font-size: 34px; font-weight: 700; letter-spacing: -0.02em;
		background: linear-gradient(110deg, #6ea8ff, #22d3ee); -webkit-background-clip: text; background-clip: text; color: transparent;
	}
	.tags { margin-top: 26px; display: flex; flex-wrap: wrap; gap: 10px; }
	.tags span { font-size: 19px; font-weight: 600; color: #c9d1de; background: #161d2c; border: 1px solid #263044; padding: 8px 14px; border-radius: 10px; }
	.url { margin-top: 30px; font-family: "JetBrains Mono", monospace; font-size: 22px; color: #7d889c; }
	.url b { color: #6ea8ff; font-weight: 500; }
	.side { position: relative; flex: none; width: 300px; height: 300px; }
	.photo { width: 300px; height: 300px; border-radius: 50%; object-fit: cover; border: 4px solid #1d2638; box-shadow: 0 30px 60px rgba(0,0,0,.45); }
	.ring { position: absolute; inset: -14px; border-radius: 50%; border: 2px solid rgba(110,168,255,.35); }
	.badge {
		position: absolute; left: 50%; bottom: -34px; transform: translateX(-50%); width: max-content;
		display: flex; align-items: center; gap: 12px; padding: 10px 18px 10px 10px; border-radius: 16px;
		background: #111724; border: 1px solid #2a3446; box-shadow: 0 12px 30px rgba(0,0,0,.4);
	}
	.badge img { width: 54px; height: 54px; }
	.badge strong { display: block; font-size: 19px; color: #fff; }
	.badge small { font-size: 15px; color: #7d889c; }
	.bar { position: absolute; left: 0; right: 0; bottom: 0; height: 6px; background: linear-gradient(90deg, #2563eb, #22d3ee); }
</style>
</head>
<body>
	<div class="grid"></div>
	<div class="wrap">
		<div class="text">
			<span class="eyebrow"><i></i>Cloud Architect · Full Stack Developer</span>
			<h1>Sankara Narayanan<br>Paramasivam</h1>
			<div class="role">Technical Lead · Banking &amp; Payments</div>
			<div class="tags"><span>GCP</span><span>Kubernetes</span><span>Node.js</span><span>React</span><span>Redis</span><span>OAuth 2.0</span></div>
			<div class="url"><b>sankar-dev.github.io</b> · 12+ years full stack</div>
		</div>
		<div class="side">
			<div class="ring"></div>
			<img class="photo" src="../sankar.png" alt="">
			<div class="badge">
				<img src="../gcp-cloud-architect-badge.png" alt="">
				<div><strong>Certified Cloud Architect</strong><small>Google Cloud · 2026</small></div>
			</div>
		</div>
	</div>
	<div class="bar"></div>
</body>
</html>
